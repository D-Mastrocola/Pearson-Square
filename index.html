<html>
  <head>
    <title>Mixing Calculator</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <header>
        <h1>Mixing Calculator</h1>
    </header>
    <form id="batch-form">
        <label for="targetBF">Target BF%:</label><br>
        <input type="text" id="target-bf" name="targetBF"/><br>
        <label for="ingOne">Ingredient 1 BF%:</label><br>
        <input type="text" id="ing-1" name="ingOne"/><br>
        <label for="ingTwo">Ingredient 2 BF%:</label><br>
        <input type="text" id="ing-2" name="ingTwo"/><br>
        <label for="amount">Batch Amount</label><br>
        <input type="text" id="amount" name="amount"/><br>
        <button type="submit">Calculate</button>
    </form>
  </body>
  <script src="./main.js"></script>
</html>
